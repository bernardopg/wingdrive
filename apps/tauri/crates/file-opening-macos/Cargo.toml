[package]
name = "file-opening-macos"
license.workspace = true
version = "0.1.0"
edition = "2021"

# The crate compiles to nothing on other systems (`#![cfg(target_os = "macos")]`).
[target.'cfg(any(target_os = "macos", target_os = "ios"))'.dependencies]
serde = { version = "1.0", features = ["derive"] }
file-opening = { path = "../file-opening" }
swift-rs = { version = "1.0", features = ["serde"] }
serde_json = "1.0"

[target.'cfg(any(target_os = "macos", target_os = "ios"))'.build-dependencies]
swift-rs = { version = "1.0", features = ["build"] }
