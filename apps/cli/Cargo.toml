[package]
edition = "2021"
name    = "wing-cli"
version = "2.0.0-alpha.6"

[[bin]]
name = "wing"
path = "src/main.rs"

[features]
default = []
heif = ["wing-core/heif"]
ffmpeg = ["wing-core/ffmpeg"]
whisper = ["wing-core/whisper"]
speech-to-text = ["wing-core/speech-to-text"]
ai = ["wing-core/ai"]

[dependencies]
anyhow      = "1"
chrono      = { version = "0.4", features = ["serde"] }
clap        = { version = "4", features = ["derive"] }
comfy-table = "8.0"
crossterm   = "0.29"
dirs        = "6.0"
indicatif   = "0.18"
inquire     = "0.9"
qr2term     = "0.3"
ratatui     = "0.30"
reqwest     = { version = "0.12", features = ["json"] }
wing-core     = { path = "../../core", features = ["cli"] }
serde       = { version = "1", features = ["derive"] }
serde_json  = "1"
tokio       = { version = "1", features = ["full"] }
uuid        = { version = "1", features = ["serde", "v4"] }
