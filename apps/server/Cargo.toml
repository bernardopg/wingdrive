[package]
name    = "wing-server"
version = "2.0.0-alpha.5"
edition = "2021"

[features]
default = []
heif = ["wing-core/heif"]
ffmpeg = ["wing-core/ffmpeg"]
whisper = ["wing-core/whisper"]
speech-to-text = ["wing-core/speech-to-text"]
ai = ["wing-core/ai"]

[dependencies]
# WingDrive core
wing-core = { path = "../../core" }

# HTTP server
axum       = "0.8.9"
axum-extra = { version = "0.12.6", features = ["typed-header"] }
http       = "1.1"
tokio      = { version = "1", features = ["rt-multi-thread", "signal", "sync", "io-util", "fs"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["io"] }
uuid = "1.10"
tower      = "0.5"
tower-http = { version = "0.6.11", features = ["fs", "cors"] }
futures    = "0.3"

# Embedded web UI
rust-embed = "8"
mime_guess = "2"

# Auth
secstr = "0.5"

# Serialization
serde      = { version = "1", features = ["derive"] }
serde_json = "1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow    = "1"
thiserror = "1"

# CLI
clap = { version = "4", features = ["derive"] }

# Default data directory resolution in dev mode
dirs = "6.0"

# Dev dependencies
tempfile = "3"

[[bin]]
name = "wing-server"
path = "src/main.rs"
