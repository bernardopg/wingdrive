<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WingDrive promo</title>
<style>
@font-face { font-family: "SG"; src: url(assets/fonts/space-grotesk-latin-wght-normal.woff2) format("woff2"); font-weight: 300 700; }
@font-face { font-family: "Inter"; src: url(assets/fonts/inter-latin-wght-normal.woff2) format("woff2"); font-weight: 100 900; }
@font-face { font-family: "JBM"; src: url(assets/fonts/jetbrains-mono-latin-wght-normal.woff2) format("woff2"); font-weight: 100 800; }
:root {
	--bg: #05040b;
	--ink: #f5f3ff;
	--mute: #a19fb8;
	--dim: #6b6886;
	--violet: #8b5cf6;
	--indigo: #4338ca;
	--lilac: #c4b5fd;
	--line: rgba(255, 255, 255, 0.09);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #000; overflow: hidden; }
#stage {
	position: relative; overflow: hidden; background: var(--bg); color: var(--ink);
	font-family: "Inter", system-ui, sans-serif; -webkit-font-smoothing: antialiased;
	font-feature-settings: "ss01", "cv11";
}
.layer { position: absolute; inset: 0; }
.scene { position: absolute; inset: 0; display: none; will-change: opacity, transform, filter; }
.center { display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.w { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
.h1 { font-family: "SG"; font-weight: 600; letter-spacing: -0.035em; line-height: 1.02; }
.h2 { font-family: "SG"; font-weight: 600; letter-spacing: -0.03em; line-height: 1.06; }
.eyebrow { font-family: "JBM"; font-weight: 500; text-transform: uppercase; letter-spacing: 0.24em; color: #a78bfa; }
.body { color: var(--mute); font-weight: 400; line-height: 1.45; letter-spacing: -0.005em; }
.grad {
	background: linear-gradient(100deg, #ede9fe 0%, #c4b5fd 30%, #8b5cf6 62%, #6366f1 100%);
	-webkit-background-clip: text; background-clip: text; color: transparent;
}
.mono { font-family: "JBM"; }
.win {
	position: absolute; border-radius: calc(16px * var(--u)); overflow: hidden;
	background: #12111a; border: 1px solid rgba(255, 255, 255, 0.1);
	box-shadow: 0 calc(50px * var(--u)) calc(140px * var(--u)) rgba(0, 0, 0, 0.75),
		0 0 0 1px rgba(0, 0, 0, 0.4), 0 calc(10px * var(--u)) calc(60px * var(--u)) rgba(76, 29, 149, 0.28);
}
.win .bar { height: calc(30px * var(--u)); background: #0c0b12; display: flex; align-items: center; gap: calc(8px * var(--u)); padding-left: calc(14px * var(--u)); border-bottom: 1px solid rgba(255,255,255,.05); }
.win .bar i { width: calc(10px * var(--u)); height: calc(10px * var(--u)); border-radius: 50%; background: #2a2838; display: block; }
.win img { display: block; width: 100%; }
.chip {
	display: inline-flex; align-items: center; gap: calc(12px * var(--u));
	border-radius: 999px; border: 1px solid rgba(167, 139, 250, 0.22);
	background: linear-gradient(180deg, rgba(139, 92, 246, 0.12), rgba(67, 56, 202, 0.06));
	color: #e9e5ff; font-weight: 500; white-space: nowrap;
}
.dot { width: calc(9px * var(--u)); height: calc(9px * var(--u)); border-radius: 50%; background: var(--violet); box-shadow: 0 0 calc(14px * var(--u)) var(--violet); }
.key {
	display: inline-flex; align-items: center; justify-content: center; font-family: "SG"; font-weight: 500;
	border-radius: calc(22px * var(--u)); color: #f5f3ff;
	background: linear-gradient(180deg, #2a2640 0%, #1a1729 100%);
	border: 1px solid rgba(255,255,255,.12);
}
.pill { font-family: "JBM"; font-weight: 500; letter-spacing: .06em; border-radius: 999px; padding: calc(6px * var(--u)) calc(16px * var(--u)); text-transform: uppercase; }
.ok { color: #86efac; background: rgba(34,197,94,.1); border: 1px solid rgba(34,197,94,.28); }
.warn { color: #fcd34d; background: rgba(245,158,11,.1); border: 1px solid rgba(245,158,11,.28); }
.dimp { color: #c4b5fd; background: rgba(139,92,246,.1); border: 1px solid rgba(139,92,246,.28); }
</style>
</head>
<body>
<div id="stage">
	<div class="layer" id="bg"></div>
	<div class="layer" id="scenes"></div>
	<div class="layer" id="fx"></div>
</div>
<script src="engine.js"></script>
</body>
</html>
