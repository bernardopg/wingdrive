# CodeQL configuration shared by every language in .github/workflows/codeql.yml.
name: WingDrive CodeQL

# security-extended adds lower-precision security queries to the default suite.
# Quality-only queries stay out, so every alert is a security finding.
queries:
  - uses: security-extended

# Generated, vendored and build output. Alerts there either cannot be fixed in
# this repository or duplicate an alert on the source that produced them.
paths-ignore:
  - "**/node_modules/**"
  - "**/dist/**"
  - target/**
  # GHSA-wrw7-89jp-8q8g backport of upstream glib, kept byte-for-byte with upstream.
  - patches/**
  # Generated by `cargo run --bin generate_typescript_types`.
  - packages/ts-client/src/generated/**
  - whitepaper/**
  - docs/**
  # Each extra Cargo workspace makes the Rust extractor resolve another dependency graph
  # before extracting. These ship nothing to users: a GPUI prototype, Criterion
  # benchmarks and WASM extension samples.
  - apps/gpui-photo-grid/**
  - core/benchmarks/**
  - extensions/**
