name: Setup Rust
description: Setup Rust toolchain and dependencies
inputs:
  target:
    description: toolchain target triple
    required: false
  save-cache:
    description: Whether to save the Rust cache
    required: false
    default: 'false'
  cache-key:
    description: Separates caches whose builds differ, such as CI debug and release
    required: false
    default: ''
  restore-cache:
    description: Whether to restore the Rust cache
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Check if Rust is already installed
      id: check-rust
      shell: bash
      run: |
        if command -v rustc &> /dev/null && command -v rustup &> /dev/null; then
          echo "installed=true" >> $GITHUB_OUTPUT
        else
          echo "installed=false" >> $GITHUB_OUTPUT
        fi

    - name: Install Rust
      if: steps.check-rust.outputs.installed == 'false'
      id: toolchain
      uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # v1
      with:
        toolchain: stable
        targets: ${{ inputs.target }}
        components: clippy, rustfmt

    - name: Ensure rustup binaries are used
      shell: bash
      run: |
        # Ensure rustup's cargo/rustc are in PATH before Homebrew's
        if [ -d "$HOME/.cargo/bin" ]; then
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH
        fi

    - name: Add build target (self-hosted only)
      if: ${{ inputs.target != '' && steps.check-rust.outputs.installed == 'true' }}
      shell: bash
      run: |
        rustup target add ${{ inputs.target }}

    - name: Verify Rust installation
      shell: bash
      run: |
        rustc --version
        rustup show
        which rustc
        which cargo

    # rust-cache hashes every installed toolchain into its key, so the image's own
    # stable would invalidate the cache each time GitHub updates the runner image.
    - name: Keep only the pinned toolchain
      if: runner.environment == 'github-hosted'
      shell: bash
      run: |
        pinned=$(rustup show active-toolchain | cut -d' ' -f1)
        rustup toolchain list | cut -d' ' -f1 | while read -r toolchain; do
          if [ "$toolchain" != "$pinned" ]; then rustup toolchain uninstall "$toolchain"; fi
        done
        rustup toolchain list

    - name: Cache Rust Dependencies
      if: ${{ inputs.restore-cache == 'true' }}
      uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      with:
        save-if: ${{ inputs.save-cache }}
        cache-on-failure: true
        # rust-cache leaves `key` out of the final key when shared-key is set, so the
        # suffix goes here to keep CI, desktop release and server release caches apart.
        shared-key: stable-cache-v7-${{ inputs.target }}${{ inputs.cache-key && format('-{0}', inputs.cache-key) || '' }}

    # TODO: Re-enable cargo config generation when preprep.mjs is ported
    # For now, use cargo's defaults which work fine without native deps
    # - name: Cargo config.toml
    #   shell: bash
    #   run: echo '{}' | npx -y mustache - .cargo/config.toml.mustache .cargo/config.toml
