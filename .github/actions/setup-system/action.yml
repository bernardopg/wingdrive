name: Setup System and Rust
description: Setup System and Rust
inputs:
  token:
    description: Github token
    required: false
    default: ''
  target:
    description: toolchain target triple
    required: false
  setup-arg:
    description: Argument for the system setup script
    required: false
    default: ''
  save-cache:
    description: Whether to save the System cache
    required: false
    default: 'false'
  cache-key:
    description: Rust cache key suffix passed to setup-rust
    required: false
    default: ''
  xtask-setup-args:
    description: Extra arguments for `cargo xtask setup`, such as --no-daemon
    required: false
    default: ''
runs:
  using: 'composite'
  steps:
    # Defender scans every file the build and the tests write. With it on, the sync tests
    # indexed 2.5 files/s and their messages hit the 30 s send timeout. Runners are
    # discarded after the job, so nothing outlives this.
    - name: Turn off Defender real-time scanning
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction Continue
        $enabled = (Get-MpComputerStatus).RealTimeProtectionEnabled
        if ($enabled) { "::warning::Defender real-time scanning is still on; Windows tests will be slow." }
        "Defender real-time scanning enabled: $enabled"

    # The image ships a full LLVM and MinGW. clang-cl.exe breaks aws-lc-sys (see below),
    # and MinGW's gcc, cmake and nasm would shadow the MSVC toolchain.
    - name: Remove LLVM and MinGW from PATH
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      run: |
        $kept = $env:Path -split ';' | Where-Object { $_ -and $_ -notmatch '\\LLVM\\|\\mingw64\\|\\Strawberry\\c\\' }
        "PATH=$($kept -join ';')" | Out-File -FilePath $env:GITHUB_ENV -Append
        # shell: bash finds Git's MSYS perl first, which lacks the modules OpenSSL's Configure needs.
        "OPENSSL_SRC_PERL=C:\Strawberry\perl\bin\perl.exe" | Out-File -FilePath $env:GITHUB_ENV -Append

    - name: Restore cached libclang
      if: ${{ runner.os == 'Windows' }}
      id: cache-libclang
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: libclang-15-win64
        path: C:\libclang

    - name: Download libclang for bindgen
      if: ${{ runner.os == 'Windows' && steps.cache-libclang.outputs.cache-hit != 'true' }}
      shell: powershell
      run: |
        # Only libclang.dll is needed (for bindgen). Installing the full LLVM toolchain
        # puts clang-cl.exe on PATH, which causes aws-lc-sys to mis-detect compiler
        # support for __builtin_bswap — leading to unresolved symbol errors with MSVC.
        $installer = "$env:TEMP\llvm-15.exe"
        Invoke-WebRequest -Uri "https://github.com/llvm/llvm-project/releases/download/llvmorg-15.0.7/LLVM-15.0.7-win64.exe" -OutFile $installer
        New-Item -ItemType Directory -Force -Path "C:\libclang"
        7z e $installer "-oC:\libclang" "bin\libclang.dll" -r -y
        Remove-Item $installer -Force
        if (!(Test-Path "C:\libclang\libclang.dll")) {
          Write-Error "Failed to extract libclang.dll"
          exit 1
        }
        Write-Host "Extracted libclang.dll to C:\libclang"

    - name: Save libclang cache
      if: ${{ runner.os == 'Windows' && inputs.save-cache == 'true' }}
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        key: ${{ steps.cache-libclang.outputs.cache-primary-key }}
        path: C:\libclang

    - name: Set LIBCLANG_PATH
      if: ${{ runner.os == 'Windows' }}
      shell: pwsh
      # pwsh writes UTF-8. Windows PowerShell's >> writes UTF-16, which the runner cannot read.
      run: '"LIBCLANG_PATH=C:\libclang" | Out-File -FilePath $env:GITHUB_ENV -Append'

    - name: Install current Bash on macOS
      shell: bash
      if: runner.os == 'macOS'
      run: brew install bash

    - name: Install Nasm
      if: ${{ runner.os != 'Linux' }}
      uses: ilammy/setup-nasm@72793074d3c8cdda771dba85f6deafe00623038b # v1.5.2

    - name: Install Mold (linker)
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: |
        curl -L# 'https://github.com/rui314/mold/releases/download/v2.4.0/mold-2.4.0-x86_64-linux.tar.gz' \
        | sudo tar -xzf- -C /usr/local

    - name: Remove 32-bit libs and incompatible pre-installed pkgs from Runner
      shell: bash
      if: ${{ runner.os == 'Linux' }}
      run: |
        set -eux
        if dpkg -l | grep i386; then
          sudo apt-get purge --allow-remove-essential libc6-i386 ".*:i386" || true
          sudo dpkg --remove-architecture i386 || true
        fi

        # https://github.com/actions/runner-images/issues/9546#issuecomment-2014940361
        sudo apt-get remove libunwind-* || true

    - name: Setup Rust and Dependencies
      uses: ./.github/actions/setup-rust
      with:
        target: ${{ inputs.target }}
        save-cache: ${{ inputs.save-cache }}
        cache-key: ${{ inputs.cache-key }}

    - name: Run setup.sh script
      shell: bash
      if: ${{ runner.os == 'Linux' || runner.os == 'macOS' }}
      run: ./scripts/setup.sh ${{ inputs.setup-arg }}

    - name: Run setup.ps1 script
      shell: powershell
      if: ${{ runner.os == 'Windows' }}
      run: ./scripts/setup.ps1

    - name: Setup native dependencies
      shell: bash
      env:
        TARGET_TRIPLE: ${{ inputs.target }}
        GITHUB_TOKEN: ${{ inputs.token }}
      run: cargo run -p xtask -- setup ${{ inputs.xtask-setup-args }}
