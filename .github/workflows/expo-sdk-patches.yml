name: Expo SDK patches

# Weekly check of apps/mobile against Expo's live version list. Dependabot ignores the
# Expo packages (the SDK pins them as a set), so this is what reports a new SDK patch.
# A failure here means: run `bunx expo install --fix` in apps/mobile and open a PR.
# Pull requests check against the installed expo package instead (mobile.yml), so a
# new patch never blocks unrelated work.
on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - run: bun install --frozen-lockfile
      - name: Packages match the latest Expo SDK patch
        run: bunx expo install --check
        working-directory: apps/mobile
