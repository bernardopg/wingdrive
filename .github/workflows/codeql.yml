name: CodeQL

# Advanced setup replaces the repository's CodeQL default setup. Default setup
# cannot read .github/codeql/codeql-config.yml, so it scanned vendored and
# generated code and could not run the security-extended suite. Keep default
# setup disabled: GitHub rejects uploads from this workflow while it is on.
# Categories match default setup's, so existing alerts carry over.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
            timeout: 15
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: python
            build-mode: none
            runner: ubuntu-24.04
            timeout: 15
          - language: rust
            build-mode: none
            runner: ubuntu-24.04
            timeout: 75
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
