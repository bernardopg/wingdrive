name: CodeQL

# Advanced setup replaces the repository's CodeQL default setup. Default setup
# cannot read .github/codeql/codeql-config.yml, so it scanned vendored and
# generated code and could not run the security-extended suite. Keep default
# setup disabled: GitHub rejects uploads from this workflow while it is on.
# Categories match default setup's, so existing alerts carry over.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Rust analysis takes about 35 minutes, so it runs only when the change
      # reaches Rust code. The weekly schedule and manual runs always include it.
      - name: Check whether the change reaches Rust code
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          case "$EVENT" in
            pull_request) range="$BASE_SHA...$HEAD_SHA" ;;
            push) range="$BEFORE_SHA..HEAD" ;;
            *) echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if ! changed=$(git diff --name-only "$range" 2>/dev/null) \
            || grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/(codeql/|workflows/codeql\.yml$)' <<< "$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
            timeout: 15
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: python
            build-mode: none
            runner: ubuntu-24.04
            timeout: 15
          - language: rust
            build-mode: none
            runner: ubuntu-24.04
            timeout: 75
    steps:
      - name: Checkout repository
        if: matrix.language != 'rust' || needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: matrix.language != 'rust' || needs.changes.outputs.rust == 'true'
        uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        if: matrix.language != 'rust' || needs.changes.outputs.rust == 'true'
        uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          category: /language:${{ matrix.language }}
