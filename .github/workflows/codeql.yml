name: CodeQL

# Advanced setup replaces the repository's CodeQL default setup. Default setup
# cannot read .github/codeql/codeql-config.yml, so it scanned vendored and
# generated code and could not run the security-extended suite. Keep default
# setup disabled: GitHub rejects uploads from this workflow while it is on.
# Categories match default setup's, so existing alerts carry over.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # The Rust analysis takes about 30 minutes (14 to extract, 13 to evaluate) and has
      # no build to cache. Pull requests skip it and upload an empty result, so it never
      # gates a merge. Pushes to main skip it too: the nightly run analyzes what reached
      # Rust code since the last nightly analysis, so a merge day costs one analysis, not
      # one per merge. Manual runs always include it. Alerts surface by the next morning.
      # See docs/ci/ci-performance-review.md.
      - name: Check whether the change reaches Rust code
        id: filter
        env:
          EVENT: ${{ github.event_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$EVENT" in
            schedule)
              base=$(gh run list -R "$GITHUB_REPOSITORY" -w codeql.yml --event schedule --branch main \
                --status success --limit 1 --json headSha -q '.[0].headSha // empty')
              range="$base..HEAD"
              ;;
            workflow_dispatch) echo "rust=true" >> "$GITHUB_OUTPUT"; exit 0 ;;
            *) echo "rust=false" >> "$GITHUB_OUTPUT"; exit 0 ;;
          esac
          if [ -z "$base" ] || ! changed=$(git diff --name-only "$range" 2>/dev/null) \
            || grep -qE '\.rs$|(^|/)Cargo\.(toml|lock)$|^\.github/(codeql/|workflows/codeql\.yml$)' <<< "$changed"; then
            echo "rust=true" >> "$GITHUB_OUTPUT"
          else
            echo "rust=false" >> "$GITHUB_OUTPUT"
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: changes
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout }}
    permissions:
      actions: read
      contents: read
      packages: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
            runner: ubuntu-24.04
            timeout: 15
          - language: javascript-typescript
            build-mode: none
            runner: ubuntu-24.04
            timeout: 30
          - language: python
            build-mode: none
            runner: ubuntu-24.04
            timeout: 15
          - language: rust
            build-mode: none
            runner: ubuntu-24.04
            timeout: 75
    steps:
      - name: Checkout repository
        if: matrix.language != 'rust' || needs.changes.outputs.rust == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        if: matrix.language != 'rust' || needs.changes.outputs.rust == 'true'
        uses: github/codeql-action/init@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL analysis
        if: matrix.language != 'rust' || needs.changes.outputs.rust == 'true'
        uses: github/codeql-action/analyze@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          category: /language:${{ matrix.language }}

      # Code scanning merge protection needs a Rust result on every pull request,
      # so pull requests report an empty one. Pushes to main upload
      # nothing instead, which keeps main's last real Rust analysis and its alerts.
      - name: Write an empty Rust result for a pull request without Rust changes
        if: matrix.language == 'rust' && needs.changes.outputs.rust != 'true' && github.event_name == 'pull_request'
        run: |
          cat > "$RUNNER_TEMP/rust-skipped.sarif" <<'SARIF'
          {"version":"2.1.0","$schema":"https://json.schemastore.org/sarif-2.1.0.json",
           "runs":[{"tool":{"driver":{"name":"CodeQL","rules":[]}},"results":[]}]}
          SARIF

      - name: Upload the empty Rust result
        if: matrix.language == 'rust' && needs.changes.outputs.rust != 'true' && github.event_name == 'pull_request'
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: ${{ runner.temp }}/rust-skipped.sarif
          category: /language:rust
