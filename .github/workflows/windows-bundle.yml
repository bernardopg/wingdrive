name: WingDrive Windows Bundles

# Builds the NSIS and MSI installers, installs each one, runs the daemon and the app
# from the installed files, and uninstalls them. The Release workflow calls this for a
# tag. Pull requests that change the installers run it too, so a build can be tried
# from the run's artifacts without publishing a version.

on:
  pull_request:
    paths:
      - .github/workflows/windows-bundle.yml
      - apps/tauri/src-tauri/tauri.conf.json
      - apps/tauri/src-tauri/tauri.windows.conf.json
      - scripts/release/windows_smoke.ps1
      - scripts/release/daemon_smoke.py
  workflow_dispatch:
  workflow_call:
    inputs:
      release-tag:
        description: Version tag to build. Empty builds the current commit.
        type: string
        required: false
        default: ''

permissions:
  contents: read

env:
  CARGO_BUILD_JOBS: '4'
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  # version.py and the smoke tests read UTF-8 files, and Python on Windows defaults to cp1252.
  PYTHONUTF8: '1'
  RELEASE_TAG: ${{ inputs.release-tag }}
  # WingDrive's own OAuth clients (INTG-001, INTG-022), compiled into wing-core
  # with option_env!. Without the secrets the build still works and users sign in
  # with a client of their own.
  WINGDRIVE_GOOGLE_CLIENT_ID: ${{ secrets.WINGDRIVE_GOOGLE_CLIENT_ID }}
  WINGDRIVE_GOOGLE_CLIENT_SECRET: ${{ secrets.WINGDRIVE_GOOGLE_CLIENT_SECRET }}
  WINGDRIVE_MICROSOFT_CLIENT_ID: ${{ secrets.WINGDRIVE_MICROSOFT_CLIENT_ID }}
  # Browser API key for the Google Picker (INTG-011), restricted to the Picker API.
  WINGDRIVE_GOOGLE_API_KEY: ${{ secrets.WINGDRIVE_GOOGLE_API_KEY }}

jobs:
  # A version bump edits tauri.conf.json, which would start a 50 minute installer build on a
  # release pull request; the release builds the installers from the tag right after.
  changes:
    name: Detect installer changes
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check whether more than the version changed
        id: filter
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=$(scripts/ci-changed-files.sh "$BASE_SHA...$HEAD_SHA")
          if grep -qE '^(\.github/workflows/windows-bundle\.yml|apps/tauri/src-tauri/tauri(\.windows)?\.conf\.json|scripts/release/(windows_smoke\.ps1|daemon_smoke\.py))$' <<< "$changed"; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
          fi

  bundles:
    name: Verify Windows x86_64 installers
    needs: changes
    # The changes job runs only for pull requests; release and manual runs always build.
    if: ${{ !cancelled() && (github.event_name != 'pull_request' || needs.changes.outputs.build == 'true') }}
    runs-on: windows-2025
    timeout-minutes: 180
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-tag || github.sha }}
          persist-credentials: false
      - name: Validate tag and product versions
        if: ${{ inputs.release-tag != '' }}
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          python scripts/release/version.py "$RELEASE_TAG"
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      # Tauri's beforeBuildCommand builds the release daemon, so the setup skips it.
      - name: Setup System and Rust
        uses: ./.github/actions/setup-system
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: x86_64-pc-windows-msvc
          save-cache: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          cache-key: release-windows
          xtask-setup-args: --no-daemon
      # From the workflow commit, so a dispatch can re-verify an older tag with the current gate.
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          sparse-checkout: scripts/release
          persist-credentials: false
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      # Authenticode (REL-001): a tagged release signs the programs and installers through Azure
      # Artifact Signing when its secrets exist. Without them the installers ship unsigned with a
      # warning on the run, and pull requests never sign.
      - name: Prepare Authenticode signing
        id: authenticode
        if: ${{ inputs.release-tag != '' }}
        env:
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          SIGNING_ENDPOINT: ${{ secrets.WINDOWS_SIGNING_ENDPOINT }}
          SIGNING_ACCOUNT: ${{ secrets.WINDOWS_SIGNING_ACCOUNT }}
          SIGNING_PROFILE: ${{ secrets.WINDOWS_SIGNING_PROFILE }}
        run: |
          missing=()
          for name in AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET SIGNING_ENDPOINT SIGNING_ACCOUNT SIGNING_PROFILE; do
            [ -n "${!name}" ] || missing+=("$name")
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::warning title=Unsigned Windows installers::$RELEASE_TAG ships without Authenticode; missing ${missing[*]} (REL-001)."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cargo install --locked artifact-signing-cli --version 0.12.0
          # Tauri runs the command on every program it bundles and on each installer; -d is the
          # name the UAC prompt shows for the MSI.
          config="$RUNNER_TEMP/authenticode.json"
          python - "$config" <<'PY'
          import json, os, sys
          command = " ".join([
              "artifact-signing-cli",
              "-e", os.environ["SIGNING_ENDPOINT"],
              "-a", os.environ["SIGNING_ACCOUNT"],
              "-c", os.environ["SIGNING_PROFILE"],
              "-d", "WingDrive",
              "%1",
          ])
          with open(sys.argv[1], "w", encoding="utf-8") as file:
              json.dump({"bundle": {"windows": {"signCommand": command}}}, file)
          PY
          echo "enabled=true" >> "$GITHUB_OUTPUT"
          echo "config=$config" >> "$GITHUB_OUTPUT"
      - name: Build production installers
        env:
          # The updater key (REL-001) signs the installers of tagged releases.
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.release-tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.release-tag != '' && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
          # artifact-signing-cli reads the Azure credentials; empty unless the step above enabled signing.
          AZURE_TENANT_ID: ${{ steps.authenticode.outputs.enabled == 'true' && secrets.AZURE_TENANT_ID || '' }}
          AZURE_CLIENT_ID: ${{ steps.authenticode.outputs.enabled == 'true' && secrets.AZURE_CLIENT_ID || '' }}
          AZURE_CLIENT_SECRET: ${{ steps.authenticode.outputs.enabled == 'true' && secrets.AZURE_CLIENT_SECRET || '' }}
          AUTHENTICODE_CONFIG: ${{ steps.authenticode.outputs.config }}
        run: |
          # WiX accepts only a numeric pre-release, so alpha, beta and rc tags ship the NSIS installer alone.
          case "$RELEASE_TAG" in
            *-*) bundles=nsis ;;
            *) bundles=nsis,msi ;;
          esac
          # Each --config is merged over the last.
          configs=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            configs+=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          fi
          if [ -n "$AUTHENTICODE_CONFIG" ]; then
            configs+=(--config "$AUTHENTICODE_CONFIG")
          fi
          bun run --cwd apps/tauri tauri build --verbose --target x86_64-pc-windows-msvc --bundles "$bundles" "${configs[@]}"
      - name: Check Authenticode signatures
        if: ${{ steps.authenticode.outputs.enabled == 'true' }}
        shell: pwsh
        run: |
          # The installers must be signed; the programs inside are listed for the log.
          $release = 'target/x86_64-pc-windows-msvc/release'
          $installers = @(Get-ChildItem "$release/bundle/nsis/*-setup.exe") +
            @(Get-ChildItem "$release/bundle/msi/*.msi" -ErrorAction SilentlyContinue)
          $programs = @('WingDrive.exe', 'wing-daemon.exe', 'wing.exe') |
            ForEach-Object { Get-Item "$release/$_" -ErrorAction SilentlyContinue }
          foreach ($file in $installers + $programs) {
            $signature = Get-AuthenticodeSignature $file.FullName
            Write-Output "$($signature.Status) $($file.Name) $($signature.SignerCertificate.Subject)"
          }
          $unsigned = $installers | Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($unsigned) { throw "Installers not signed: $($unsigned.Name -join ', ')" }
      - name: Verify the NSIS installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe
          ./release-tooling/scripts/release/windows_smoke.ps1 -Kind nsis -Installer $installer.FullName -DaemonSmoke release-tooling/scripts/release/daemon_smoke.py
      - name: Verify the MSI installer
        if: ${{ !contains(inputs.release-tag, '-') }}
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi
          ./release-tooling/scripts/release/windows_smoke.ps1 -Kind msi -Installer $installer.FullName -DaemonSmoke release-tooling/scripts/release/daemon_smoke.py
      - name: Prepare release assets
        run: |
          if [ -n "$RELEASE_TAG" ]; then
            version="${RELEASE_TAG#v}"
          else
            version=$(python -c "import json; print(json.load(open('apps/tauri/src-tauri/tauri.conf.json'))['version'])")
          fi
          mkdir dist
          cp target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe "dist/WingDrive-$version-x64-setup.exe"
          for sig in target/x86_64-pc-windows-msvc/release/bundle/nsis/*-setup.exe.sig; do
            [ -f "$sig" ] && cp "$sig" "dist/WingDrive-$version-x64-setup.exe.sig"
          done
          case "$RELEASE_TAG" in
            *-*) ;;
            *) cp target/x86_64-pc-windows-msvc/release/bundle/msi/*.msi "dist/WingDrive-$version-x64.msi" ;;
          esac
          # The command line and the daemon on their own, for scripts and servers.
          python release-tooling/scripts/release/package_server.py windows "$version" \
            target/x86_64-pc-windows-msvc/release apps/.deps/bin dist
          cd dist
          sha256sum ./* > SHA256SUMS-windows
      - name: Verify the command line archive
        shell: pwsh
        run: |
          # Extracted somewhere new, with only Windows on PATH, both programs must start:
          # a DLL missing from the archive stops them before --help prints anything.
          $zip = Get-ChildItem dist/wing-*-windows-x64.zip
          $out = Join-Path $env:RUNNER_TEMP 'wing-cli'
          Expand-Archive -Path $zip.FullName -DestinationPath $out -Force
          $dir = Get-ChildItem $out -Directory | Select-Object -First 1
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot"
          foreach ($program in 'wing.exe', 'wing-daemon.exe') {
            $output = & (Join-Path $dir.FullName $program) --help 2>&1
            if ($LASTEXITCODE -ne 0) { $output; throw "$program --help failed with $LASTEXITCODE" }
            "$program --help: ok"
          }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingdrive-windows-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14
