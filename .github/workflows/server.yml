name: WingDrive Server Image

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build native ${{ matrix.arch }} server
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.2"

      - name: Build web frontend
        run: |
          bun install --frozen-lockfile
          bun run build
        working-directory: apps/web

      - name: Setup Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}

      - name: Build and publish image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=ghcr.io/${{ github.repository }}/server,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=wingdrive-server-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=wingdrive-server-${{ matrix.arch }}
      - name: Export image digest
        env:
          SERVER_IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          test -n "$SERVER_IMAGE_DIGEST"
          mkdir -p "$RUNNER_TEMP/wingdrive-digests"
          touch "$RUNNER_TEMP/wingdrive-digests/${SERVER_IMAGE_DIGEST#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wingdrive-server-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/wingdrive-digests/*
          if-no-files-found: error
          retention-days: 1

  manifest:
    name: Publish verified multi-platform server image
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: wingdrive-server-digest-*
          merge-multiple: true
          path: ${{ runner.temp }}/wingdrive-digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}/server
          tags: |
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-') }}
      - name: Publish manifest after both native builds pass
        env:
          SERVER_IMAGE_METADATA: ${{ steps.meta.outputs.json }}
        run: |
          digest_files=("$RUNNER_TEMP/wingdrive-digests/"*)
          test "${#digest_files[@]}" -eq 2
          mapfile -t server_tags < <(jq -r '.tags[]' <<< "$SERVER_IMAGE_METADATA")
          test "${#server_tags[@]}" -gt 0
          server_manifest_args=()
          for tag in "${server_tags[@]}"; do
            server_manifest_args+=(--tag "$tag")
          done
          for digest_file in "${digest_files[@]}"; do
            digest="$(basename "$digest_file")"
            [[ "$digest" =~ ^[a-f0-9]{64}$ ]]
            server_manifest_args+=("ghcr.io/$GITHUB_REPOSITORY/server@sha256:$digest")
          done
          docker buildx imagetools create "${server_manifest_args[@]}"
          docker buildx imagetools inspect --raw "${server_tags[0]}" > "$RUNNER_TEMP/wingdrive-server-manifest.json"
          jq -e '([.manifests[].platform | select(.os == "linux") | .architecture | select(. == "amd64" or . == "arm64")] | unique) == ["amd64", "arm64"]' "$RUNNER_TEMP/wingdrive-server-manifest.json"
