name: WingDrive CI

on:
  push:
    branches: [main]
  pull_request:
  # Nightly full run on main refreshes the Rust cache that pull requests restore.
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  WINGDRIVE_CUSTOM_APT_FLAGS: --no-install-recommends

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Main keeps every run, so a tagged commit always has a finished CI run for the release gate.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detect Rust changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: read
    outputs:
      rust: ${{ steps.filter.outputs.scope != 'none' && steps.filter.outputs.verified != 'true' }}
      scope: ${{ steps.filter.outputs.scope }}
      verified: ${{ steps.filter.outputs.verified }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # A push to main that merged an up-to-date pull request repeats a run that
      # already passed on the same tree, so it skips every job. Other pushes run
      # only the gates their changes need; the nightly schedule runs everything.
      - name: Check which gates the changed files need
        id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          CHECK_WORKFLOW: ci.yml
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
        run: scripts/ci-changes.sh | tee -a "$GITHUB_OUTPUT"

  repository:
    name: Repository Metadata
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Cached like the Rust job, so task-validator stops compiling from scratch on every run.
      - name: Setup Rust
        uses: ./.github/actions/setup-rust
        with:
          save-cache: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          cache-key: metadata

      - name: Validate task files
        run: cargo run -p task-validator -- validate

      - name: Check repository independence
        run: ./scripts/check-wingdrive-independence.sh

  frontend:
    name: TypeScript
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check committed package builds are current
        run: |
          bun run --cwd packages/wingdrive-primitives build
          bun run --cwd packages/wingdrive-ai build
          git diff --exit-code -- packages/wingdrive-primitives/dist packages/wingdrive-ai/dist \
            || { echo "::error::Stale dist. Run 'bun run build' in the package and commit dist/."; exit 1; }

      - name: Typecheck
        run: bun run typecheck

      - name: Test critical frontend behavior
        run: |
          bun test packages/interface/src/routes/explorer/hooks/resolveExternalDrop.test.ts
          bun test packages/interface/src/routes/explorer/hooks/useCreateFolder.test.ts
          bun test packages/interface/src/components/TabManager/TabView.test.tsx
          bun test packages/ts-client/src/__tests__/generated-collections.test.ts
          bun test packages/interface/src/routes/explorer/fileCapabilities.test.ts
          bun test packages/interface/src/components/TabManager/remapSelectionIds.test.ts
          bun test packages/ts-client/tests/uuid-reconciliation.test.ts
          bun test packages/interface/src/routes/explorer/views/effectiveViewMode.test.ts
          bun test packages/interface/src/hooks/fileOperationOutcome.test.ts
          bun test packages/interface/src/Settings/pages/settingsPages.test.tsx
          bun test packages/interface/src/routes/explorer/hooks/searchQuery.test.ts
          bun test packages/ts-client/src/__tests__/tauri-transport.test.ts
          bun test apps/tauri/src/lib/rendering.test.js
          bun test packages/interface/src/routes/explorer/FileContextMenuProvider.test.tsx
          bun test packages/interface/src/components/TabManager/tabRouter.test.ts
          bun test packages/interface/src/hooks/undoStore.test.ts
          bun test packages/interface/src/routes/explorer/hooks/copyMoveDestination.test.ts
          bun test packages/interface/src/routes/explorer/hooks/selectionPattern.test.ts
          bun test packages/interface/src/components/Inspector/variants/checksum.test.ts
          bun test packages/interface/src/routes/explorer/views/ListView/useTable.test.tsx
          bun test packages/interface/src/routes/explorer/components/vcsStatus.test.ts
          bun test packages/interface/src/routes/explorer/views/grouping.test.ts
          bun test packages/interface/src/routes/explorer/hooks/useContextActions.test.ts
          bun test packages/interface/src/components/SpacesSidebar/FolderTree/folderTreePaths.test.ts
          bun test packages/interface/src/routes/explorer/views/ListView/listExpansion.test.ts
          bun test packages/interface/src/hooks/adminRetry.test.ts
          bun test packages/interface/src/components/QuickPreview/pdfBinaryData.test.ts
          bun test packages/interface/src/routes/explorer/OpenFileProvider.test.tsx
          bun test packages/interface/src/routes/explorer/terminal/terminalFolder.test.ts
          bun test packages/interface/src/routes/explorer/terminal/dockedTerminals.test.ts
          bun test packages/interface/src/hooks/normalizedQuerySubscription.test.tsx

  core:
    name: Rust Workspace
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free disk space
        uses: ./.github/actions/free-disk-space
        with:
          phase: start

      - name: Setup System and Rust
        uses: ./.github/actions/setup-system
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: x86_64-unknown-linux-gnu
          # Only main saves; pull requests restore main's cache read-only.
          save-cache: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
          # Debug builds share nothing with the release workflow's cache.
          cache-key: ci
          # Checks and tests never bundle Tauri, so skip the release daemon.
          xtask-setup-args: --no-daemon

      - name: Wait for disk space
        uses: ./.github/actions/free-disk-space
        with:
          phase: wait

      # Same script as `just ci-local`. Scoped runs lint and test only the apps that changed.
      - name: Rust gates (${{ needs.changes.outputs.scope }})
        run: scripts/ci-rust.sh ${{ needs.changes.outputs.scope }}

  extensions:
    name: WASM Extensions
    needs: changes
    if: needs.changes.outputs.verified != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Each extension is its own workspace, so the Rust Workspace job never compiles them.
      - name: Build extensions for wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          for dir in extensions/test-extension extensions/photos; do
            cargo build --locked --release --target wasm32-unknown-unknown --manifest-path "$dir/Cargo.toml"
          done
