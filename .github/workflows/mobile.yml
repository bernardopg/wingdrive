name: WingDrive Mobile Validation

on:
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/ts-client/**"
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "apps/mobile/**"
      - "packages/ts-client/**"
      - ".github/workflows/mobile.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-projects:
    name: Generate Native Projects
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.0"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate Expo configuration
        run: bunx expo config --type public
        working-directory: apps/mobile

      - name: Generate Android project
        run: bunx expo prebuild --platform android --clean --no-install
        working-directory: apps/mobile

      - name: Verify WingDrive package identity
        run: |
          test -f android/app/src/main/AndroidManifest.xml
          grep "com.wingdrive.app" android/app/build.gradle
        working-directory: apps/mobile
