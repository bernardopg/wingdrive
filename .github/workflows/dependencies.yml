name: Dependencies

# Dependency checks that complement Dependabot (version updates and alerts):
#
# - cargo-deny: the Rust policy in deny.toml. Every crate must come from crates.io (no git
#   forks or branches), RustSec advisories fail the check, and licenses stay on the allow list.
# - Dependency review: a pull request that adds a dependency with a known vulnerability of
#   high severity, or a license outside the list, fails before merge. Free on public repositories.
# - OSV-Scanner: every lockfile in the repository (Cargo, bun, CocoaPods, Swift, Docker) against
#   osv.dev, which merges GitHub, RustSec, npm and other advisory databases. Results go to the
#   Security tab without failing the run; Dependabot and cargo-deny gate merges.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  osv-scanner:
    name: OSV-Scanner
    if: github.event_name != 'pull_request'
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
    with:
      runs-on: ubuntu-24.04
      fail-on-vuln: false
      scan-args: |-
        --config=osv-scanner.toml
        -r
        ./
