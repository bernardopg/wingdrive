name: WingDrive Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to verify or republish'
        required: true
        type: string
      publish:
        description: 'Publish verified assets and update wingdrive-bin on AUR'
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wingdrive-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_BUILD_JOBS: '2'
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  WINGDRIVE_TAB_SWITCH_BUDGET_MS: ${{ vars.WINGDRIVE_TAB_SWITCH_BUDGET_MS || '50' }}

jobs:
  linux:
    name: Verify Linux x86_64 bundles
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate tag and product versions
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          python3 scripts/release/version.py "$RELEASE_TAG"
      - name: Free build disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc
          df -h .
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.2'
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-unknown-linux-gnu
          save-cache: 'true'
      - name: Install Linux dependencies
        run: |
          ./scripts/setup.sh
          sudo apt-get install -y xvfb xdotool python3 imagemagick libva2 libva-drm2
      - name: Setup native libraries and daemon
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: cargo run --locked -p xtask -- setup
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          sparse-checkout: scripts/release
          persist-credentials: false
      - name: Verify fresh production daemon startup
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd target/x86_64-unknown-linux-gnu/release/wing-daemon
          python3 release-tooling/scripts/release/daemon_smoke.py target/x86_64-unknown-linux-gnu/release/wing-daemon
      - name: Check frontend types and build
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun test packages/interface/src/components/TabManager/tabRouter.test.ts packages/interface/src/hooks/undoStore.test.ts
          bun run --cwd apps/tauri build
      - name: Check Rust formatting and lint
        run: |
          cargo fmt --all --check
          cargo clippy --locked -p wingdrive -- -D warnings
      - name: Stage production daemon for native integration tests
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          mkdir -p target/debug
          install -m755 target/x86_64-unknown-linux-gnu/release/wing-daemon target/debug/wing-daemon
          target/debug/wing-daemon --help
      - name: Test desktop IPC and database migrations
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo test --locked -p wingdrive --bin WingDrive
          cargo test --locked -p wing-core --lib crypto::key_manager::tests
      - name: Build production desktop and command line binaries
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          bun run --cwd apps/tauri tauri build --verbose --target x86_64-unknown-linux-gnu --bundles appimage,deb
          bun run --cwd apps/web build
          cargo build --locked --release --target x86_64-unknown-linux-gnu --features wing-core/ffmpeg,wing-core/heif --bin wing-server --bin wing
      - name: Verify extracted AppImage
        env:
          WINGDRIVE_TEST_OUTPUT: /tmp/wingdrive-browser-evidence
        run: |
          mapfile -t images < <(find target/x86_64-unknown-linux-gnu/release/bundle -name '*.AppImage')
          test "${#images[@]}" -eq 1
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 scripts/release/smoke.py "${images[0]}"
      - name: Verify explorer in Chromium with the production backend
        env:
          BASE_URL: http://127.0.0.1:18765
          NODE_PATH: /tmp/wingdrive-playwright/node_modules
          WINGDRIVE_TEST_OUTPUT: /tmp/wingdrive-browser-evidence
        run: |
          npm install --prefix /tmp/wingdrive-playwright playwright@1.62.1
          /tmp/wingdrive-playwright/node_modules/.bin/playwright install --with-deps chromium
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          target/x86_64-unknown-linux-gnu/release/wing-server --host 127.0.0.1 --port 18765 --auth disabled --data-dir /tmp/wingdrive-browser --instance release-browser > /tmp/wingdrive-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/wingdrive-server.log | tail -30' EXIT
          for _ in {1..120}; do
            if curl -fsS "$BASE_URL/health" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$BASE_URL/health"
          node scripts/release/explorer.cjs
      - name: Preserve explorer verification evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wingdrive-explorer-evidence
          path: /tmp/wingdrive-browser-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare release assets
        run: |
          version="${RELEASE_TAG#v}"
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage "dist/WingDrive-$version-x86_64.AppImage"
          cp target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb "dist/WingDrive-$version-amd64.deb"
          cp LICENSE dist/LICENSE
          python3 release-tooling/scripts/release/aur.py "$version" "dist/WingDrive-$version-x86_64.AppImage" LICENSE packaging/aur
          cp packaging/aur/PKGBUILD dist/PKGBUILD
          cd dist
          sha256sum ./* > SHA256SUMS
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: wingdrive-linux-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish verified GitHub Release
    needs: linux
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: wingdrive-linux-release
          path: dist
      - name: Verify artifact checksums
        run: cd dist && sha256sum --check SHA256SUMS
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: WingDrive ${{ env.RELEASE_TAG }}
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*

  aur:
    name: Publish wingdrive-bin on AUR
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download published assets and verify checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist
          cd dist
          sha256sum --check SHA256SUMS
      - name: Generate and validate AUR package in Arch Linux
        run: |
          python3 scripts/release/aur.py "${RELEASE_TAG#v}" "dist/WingDrive-${RELEASE_TAG#v}-x86_64.AppImage" dist/LICENSE packaging/aur
          docker run --rm -v "$PWD:/work" archlinux:base bash -euc '
            pacman -Syu --noconfirm base-devel git
            useradd -m builder
            cp -r /work/packaging/aur /tmp/aur
            cp /work/dist/*.AppImage /work/dist/LICENSE /tmp/aur/
            chown -R builder:builder /tmp/aur
            cd /tmp/aur
            source PKGBUILD
            pacman -S --needed --noconfirm "${depends[@]}"
            pacman -S --needed --noconfirm xorg-server-xvfb xorg-xauth xdotool imagemagick python
            runuser -u builder -- makepkg --verifysource
            runuser -u builder -- makepkg --noconfirm
            pacman -U --noconfirm ./*.pkg.tar.zst
            runuser -u builder -- test -x /opt/wingdrive/AppRun
            runuser -u builder -- test -x /opt/wingdrive/usr/bin/WingDrive
            runuser -u builder -- env WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 WINGDRIVE_TEST_LAUNCHER=/usr/bin/wingdrive xvfb-run -a python /work/scripts/release/smoke.py /opt/wingdrive
            runuser -u builder -- makepkg --printsrcinfo > /work/packaging/aur/.SRCINFO
          '
      - name: Publish package metadata idempotently
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          test -n "$AUR_KNOWN_HOSTS"
          install -d -m700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/aur ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          trap 'rm -f ~/.ssh/aur' EXIT
          git clone ssh://aur@aur.archlinux.org/wingdrive-bin.git /tmp/aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git -c user.name=bernardopg -c user.email=bernardopg@users.noreply.github.com commit -m "Update WingDrive to $RELEASE_TAG"
            git push origin HEAD:master
          fi
