name: WingDrive Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to verify or republish'
        required: true
        type: string
      publish:
        description: 'Publish verified assets and update the AUR packages'
        default: false
        type: boolean
      aur_only:
        description: 'Only republish the AUR packages from the existing GitHub Release'
        default: false
        type: boolean
      component:
        description: 'Verify only one component. Publishing needs both, so pick all to publish.'
        default: all
        type: choice
        options: [all, desktop, server, windows, macos]

permissions:
  contents: read

concurrency:
  group: wingdrive-release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # One job per vCPU of the hosted runner (4 on ubuntu-24.04). Two left half
  # the cores idle through the 25 to 37 minute bundle build.
  CARGO_BUILD_JOBS: '4'
  CARGO_PROFILE_RELEASE_LTO: thin
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
  WINGDRIVE_TAB_SWITCH_BUDGET_MS: ${{ vars.WINGDRIVE_TAB_SWITCH_BUDGET_MS || '50' }}
  WINGDRIVE_NATIVE_MEMORY_BUDGET_MIB: ${{ vars.WINGDRIVE_NATIVE_MEMORY_BUDGET_MIB || '600' }}
  # Hosted runners lose about 25 s to a D-Bus timeout during GTK start-up.
  WINGDRIVE_STARTUP_BUDGET_SECONDS: ${{ vars.WINGDRIVE_STARTUP_BUDGET_SECONDS || '45' }}
  WINGDRIVE_RESIDENT_OPEN_BUDGET_MS: ${{ vars.WINGDRIVE_RESIDENT_OPEN_BUDGET_MS || '300' }}
  # WingDrive's own OAuth clients (INTG-001, INTG-022), compiled into wing-core
  # with option_env!. Without the secrets the build still works and users sign in
  # with a client of their own.
  WINGDRIVE_GOOGLE_CLIENT_ID: ${{ secrets.WINGDRIVE_GOOGLE_CLIENT_ID }}
  WINGDRIVE_GOOGLE_CLIENT_SECRET: ${{ secrets.WINGDRIVE_GOOGLE_CLIENT_SECRET }}
  WINGDRIVE_MICROSOFT_CLIENT_ID: ${{ secrets.WINGDRIVE_MICROSOFT_CLIENT_ID }}
  # Browser API key for the Google Picker (INTG-011), restricted to the Picker API.
  WINGDRIVE_GOOGLE_API_KEY: ${{ secrets.WINGDRIVE_GOOGLE_API_KEY }}

jobs:
  # Desktop bundles and the server binaries build on separate runners in parallel.
  # They share no compiled crates, so one runner only ran them one after the other.
  desktop:
    name: Verify Linux x86_64 desktop bundles
    if: ${{ !inputs.aur_only && (inputs.component == 'all' || inputs.component == 'desktop' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      # The release page starts with this version's CHANGELOG.md section, so a tag
      # without one stops here instead of after two hours of builds.
      - name: Validate tag, product versions and changelog
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          python3 scripts/release/version.py "$RELEASE_TAG"
          if [ -f scripts/release/changelog.py ]; then
            python3 scripts/release/changelog.py require "$RELEASE_TAG"
          fi
      # Runs during setup and is awaited before the build. Inline rather than the
      # free-disk-space action, because local actions load from the checked-out
      # tag and tags older than that action would fail to republish.
      - name: Free build disk space in the background
        run: |
          # shellcheck disable=SC2016 # the inner shell expands these
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc; touch "$RUNNER_TEMP/disk-cleanup.done"' \
            > "$RUNNER_TEMP/disk-cleanup.log" 2>&1 &
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-unknown-linux-gnu
          # Tag runs cannot read caches saved by other tags, only main's, so
          # only a workflow_dispatch from main saves one worth keeping.
          save-cache: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          cache-key: release-desktop
      - name: Install Linux dependencies
        run: |
          ./scripts/setup.sh
          sudo apt-get install -y xvfb xdotool python3 imagemagick libva2 libva-drm2 dbus-daemon
      - name: Wait for build disk space
        run: |
          # shellcheck disable=SC2016 # the inner shell expands these
          timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/disk-cleanup.done" ]; do sleep 2; done' \
            || { cat "$RUNNER_TEMP/disk-cleanup.log"; exit 1; }
          df -h .
      # Tauri's beforeBuildCommand builds the release daemon, so a second build here only cost time.
      - name: Setup native libraries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: cargo run --locked -p xtask -- setup --no-daemon
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          sparse-checkout: scripts/release
          persist-credentials: false
      # Typecheck, frontend tests, formatting, lint and the desktop and key storage
      # tests run in CI on the tagged commit; the `ci` job below requires that run to pass.
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile
      - name: Build production desktop bundles
        env:
          # The updater key (REL-001) signs the AppImage for installs that update themselves.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          updater=()
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            updater=(--config '{"bundle":{"createUpdaterArtifacts":true}}')
          else
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; the AppImage ships without an updater signature"
          fi
          bun run --cwd apps/tauri tauri build --verbose --target x86_64-unknown-linux-gnu --bundles appimage,deb "${updater[@]}"
      - name: Verify fresh production daemon startup
        run: |
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          ldd target/x86_64-unknown-linux-gnu/release/wing-daemon
          python3 release-tooling/scripts/release/daemon_smoke.py target/x86_64-unknown-linux-gnu/release/wing-daemon
      - name: Verify extracted AppImage
        env:
          WINGDRIVE_TEST_OUTPUT: /tmp/wingdrive-browser-evidence
        run: |
          mapfile -t images < <(find target/x86_64-unknown-linux-gnu/release/bundle -name '*.AppImage')
          test "${#images[@]}" -eq 1
          # pdfium is opened with dlopen from usr/lib/wingdrive, so no ldd check catches it missing.
          image=$(realpath "${images[0]}")
          (cd "$(mktemp -d)" && "$image" --appimage-extract usr/lib/wingdrive/libpdfium.so > /dev/null \
            && test -f squashfs-root/usr/lib/wingdrive/libpdfium.so)
          # The smoke test comes from the workflow commit, like the daemon check, so a
          # dispatch from main can re-verify an older tag with the current gate.
          xvfb-run -a -s '-screen 0 1920x1080x24' python3 release-tooling/scripts/release/smoke.py "${images[0]}"
      - name: Preserve desktop verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingdrive-desktop-evidence
          path: /tmp/wingdrive-browser-evidence/
          if-no-files-found: ignore
          retention-days: 14
      - name: Prepare release assets
        run: |
          version="${RELEASE_TAG#v}"
          mkdir dist
          cp target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage "dist/WingDrive-$version-x86_64.AppImage"
          for sig in target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig; do
            [ -f "$sig" ] && cp "$sig" "dist/WingDrive-$version-x86_64.AppImage.sig"
          done
          cp target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb "dist/WingDrive-$version-amd64.deb"
          cp LICENSE dist/LICENSE
          python3 release-tooling/scripts/release/aur.py "$version" "dist/WingDrive-$version-x86_64.AppImage" LICENSE packaging/aur
          cp packaging/aur/PKGBUILD dist/PKGBUILD
          # makepkg writes .SRCINFO; GitHub drops a leading dot from asset names, so it
          # ships as SRCINFO. The AUR job pushes the real .SRCINFO.
          docker run --rm -v "$PWD/packaging/aur:/aur:ro" archlinux:base bash -euc '
            useradd -m builder
            cp -r /aur /tmp/aur && chown -R builder /tmp/aur && cd /tmp/aur
            runuser -u builder -- makepkg --printsrcinfo
          ' > dist/SRCINFO
          grep -q "pkgver = $version" dist/SRCINFO
          cd dist
          sha256sum ./* > SHA256SUMS-linux
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingdrive-linux-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  server:
    name: Verify Linux x86_64 server and command line
    if: ${{ !inputs.aur_only && (inputs.component == 'all' || inputs.component == 'server' || github.event_name == 'push') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          persist-credentials: false
      - name: Validate tag and product versions
        run: |
          git rev-parse --verify "refs/tags/$RELEASE_TAG"
          python3 scripts/release/version.py "$RELEASE_TAG"
      # Runs during setup and is awaited before the build. Inline rather than the
      # free-disk-space action, because local actions load from the checked-out
      # tag and tags older than that action would fail to republish.
      - name: Free build disk space in the background
        run: |
          # shellcheck disable=SC2016 # the inner shell expands these
          nohup bash -c 'sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc; touch "$RUNNER_TEMP/disk-cleanup.done"' \
            > "$RUNNER_TEMP/disk-cleanup.log" 2>&1 &
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.4'
      - uses: ./.github/actions/setup-rust
        with:
          target: x86_64-unknown-linux-gnu
          save-cache: ${{ github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' }}
          cache-key: release-server
      - name: Install Linux dependencies
        run: ./scripts/setup.sh
      - name: Wait for build disk space
        run: |
          # shellcheck disable=SC2016 # the inner shell expands these
          timeout 600 bash -c 'until [ -f "$RUNNER_TEMP/disk-cleanup.done" ]; do sleep 2; done' \
            || { cat "$RUNNER_TEMP/disk-cleanup.log"; exit 1; }
          df -h .
      - name: Setup native libraries
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_TRIPLE: x86_64-unknown-linux-gnu
        run: cargo run --locked -p xtask -- setup --no-daemon
      - name: Checkout release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          sparse-checkout: scripts/release
          persist-credentials: false
      # wing-server embeds apps/web/dist at compile time, so the web build goes first.
      - name: Build production server and command line binaries
        run: |
          bun install --frozen-lockfile
          bun run --cwd apps/web build
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          cargo build --locked --release --target x86_64-unknown-linux-gnu --features wing-core/ffmpeg,wing-core/heif --bin wing-server --bin wing
      - name: Verify explorer in Chromium with the production backend
        env:
          BASE_URL: http://127.0.0.1:18765
          NODE_PATH: /tmp/wingdrive-playwright/node_modules
          WINGDRIVE_TEST_OUTPUT: /tmp/wingdrive-browser-evidence
        run: |
          npm install --prefix /tmp/wingdrive-playwright playwright@1.62.1
          /tmp/wingdrive-playwright/node_modules/.bin/playwright install --with-deps chromium
          export LD_LIBRARY_PATH="$PWD/apps/.deps/lib${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}"
          target/x86_64-unknown-linux-gnu/release/wing-server --host 127.0.0.1 --port 18765 --auth disabled --data-dir /tmp/wingdrive-browser --instance release-browser > /tmp/wingdrive-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"; cat /tmp/wingdrive-server.log | tail -30' EXIT
          for _ in {1..120}; do
            if curl -fsS "$BASE_URL/health" > /dev/null; then break; fi
            sleep 1
          done
          curl -fsS "$BASE_URL/health"
          node scripts/release/explorer.cjs
      - name: Preserve explorer verification evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingdrive-explorer-evidence
          path: /tmp/wingdrive-browser-evidence/
          if-no-files-found: ignore
          retention-days: 14
      # bin/ and lib/wingdrive/ with RUNPATH $ORIGIN/../lib/wingdrive, in three formats.
      - name: Pack the server and command line archives
        run: |
          sudo apt-get install -y patchelf
          python3 release-tooling/scripts/release/package_server.py linux "$RELEASE_TAG" \
            target/x86_64-unknown-linux-gnu/release apps/.deps/lib dist
      # Each archive, extracted in a fresh directory and run with an empty environment,
      # must start the server and answer its health check without LD_LIBRARY_PATH.
      - name: Verify the server and command line archives
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          port=18766
          for archive in dist/wing-server-"$version"-linux-x86_64.{tar.gz,tar.xz,zip}; do
            out=$(mktemp -d)
            case "$archive" in
              *.zip) unzip -q "$archive" -d "$out" ;;
              *) tar -xf "$archive" -C "$out" ;;
            esac
            root="$out/wing-server-$version-linux-x86_64"
            test -f "$root/LICENSE" && test -f "$root/NOTICE" && test -f "$root/README.md"
            test -f "$root/lib/wingdrive/libpdfium.so"
            if ldd "$root/bin/wing-server" "$root/bin/wing" | grep "not found"; then exit 1; fi
            env -i HOME="$out" "$root/bin/wing" --help > /dev/null
            env -i HOME="$out" "$root/bin/wing-server" --host 127.0.0.1 --port "$port" --auth disabled \
              --data-dir "$out/data" --instance "archive-$port" > "$out/server.log" 2>&1 &
            pid=$!
            ok=
            for _ in {1..90}; do
              if curl -fsS "http://127.0.0.1:$port/health" > /dev/null; then ok=1; break; fi
              sleep 1
            done
            kill "$pid" || true
            wait "$pid" || true
            if [ -z "$ok" ]; then tail -40 "$out/server.log"; exit 1; fi
            echo "$(basename "$archive"): server answered on port $port"
            port=$((port + 1))
          done
          cd dist
          sha256sum ./* > SHA256SUMS-server
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wingdrive-server-release
          path: dist/*
          if-no-files-found: error
          retention-days: 14

  # The Debian package of the desktop job, repackaged on the GNOME runtime.
  flatpak:
    name: Flatpak
    needs: desktop
    if: ${{ !inputs.aur_only && needs.desktop.result == 'success' }}
    uses: ./.github/workflows/flatpak-bundle.yml
    with:
      release-tag: ${{ github.event.inputs.tag || github.ref_name }}
      deb-artifact: wingdrive-linux-release

  # Apple silicon disk image, signed ad hoc until REL-001 brings a Developer ID.
  macos:
    name: macOS
    if: ${{ !inputs.aur_only && (inputs.component == 'all' || inputs.component == 'macos' || github.event_name == 'push') }}
    uses: ./.github/workflows/macos-bundle.yml
    with:
      release-tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  # Unsigned NSIS and MSI installers. REL-001 tracks signing.
  windows:
    name: Windows
    if: ${{ !inputs.aur_only && (inputs.component == 'all' || inputs.component == 'windows' || github.event_name == 'push') }}
    uses: ./.github/workflows/windows-bundle.yml
    with:
      release-tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  # Signed APK and AAB. Without the upload key secrets it builds them but uploads nothing,
  # so a desktop release does not wait on Google Play credentials (REL-001).
  android:
    name: Android
    if: ${{ !inputs.aur_only && inputs.component == 'all' || github.event_name == 'push' }}
    uses: ./.github/workflows/mobile.yml
    with:
      release-tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets:
      WINGDRIVE_ANDROID_KEYSTORE_BASE64: ${{ secrets.WINGDRIVE_ANDROID_KEYSTORE_BASE64 }}
      WINGDRIVE_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.WINGDRIVE_ANDROID_KEYSTORE_PASSWORD }}
      WINGDRIVE_ANDROID_KEY_ALIAS: ${{ secrets.WINGDRIVE_ANDROID_KEY_ALIAS }}
      WINGDRIVE_ANDROID_KEY_PASSWORD: ${{ secrets.WINGDRIVE_ANDROID_KEY_PASSWORD }}

  ci:
    name: Require green CI for the tagged commit
    if: ${{ !inputs.aur_only }}
    runs-on: ubuntu-24.04
    # The Windows Rust job alone takes about 85 minutes when main has to run it.
    timeout-minutes: 150
    permissions:
      actions: write
      contents: read
    steps:
      - name: Wait for the CI run of the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_TAG" -q .sha)
          if ! gh api "repos/$GITHUB_REPOSITORY/compare/main...$sha" -q .status | grep -qE '^(identical|behind)$'; then
            echo "::warning::$RELEASE_TAG ($sha) is not on main. Tag a commit that main already contains."
          fi
          find_run() {
            gh run list -R "$GITHUB_REPOSITORY" -w ci.yml --commit "$sha" \
              --json databaseId,conclusion -q '[.[]|select(.conclusion != "cancelled")][0].databaseId'
          }
          # A push to main starts CI a few seconds after the tag push, so wait briefly first.
          for _ in {1..4}; do
            run=$(find_run)
            [ -n "$run" ] && break
            sleep 30
          done
          # A tag on a commit that never ran CI (for example a branch commit) gets its own run.
          if [ -z "$run" ]; then
            echo "No CI run for $sha, dispatching ci.yml on $RELEASE_TAG"
            gh workflow run ci.yml -R "$GITHUB_REPOSITORY" --ref "$RELEASE_TAG"
            for _ in {1..20}; do
              sleep 15
              run=$(find_run)
              [ -n "$run" ] && break
            done
          fi
          if [ -z "$run" ]; then
            echo "::error::No CI run for $sha, and dispatching one on $RELEASE_TAG did not start it."
            exit 1
          fi
          gh run watch "$run" -R "$GITHUB_REPOSITORY" --exit-status --interval 60

  publish:
    name: Publish verified GitHub Release
    # Needing every job means a run that skipped one component never publishes.
    needs: [desktop, server, flatpak, macos, windows, android, ci]
    if: (github.event_name == 'push' || inputs.publish) && !inputs.aur_only
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      # The Android job uploads its files only when the keystore secrets exist (REL-001).
      WINGDRIVE_REQUIRE_ANDROID: ${{ secrets.WINGDRIVE_ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: wingdrive-*-release
          merge-multiple: true
          path: dist
      # Every job hashed its own files; the release keeps one SHA256SUMS for all of them.
      - name: Verify artifact checksums
        run: |
          set -euo pipefail
          cd dist
          for sums in SHA256SUMS-*; do
            echo "== $sums"
            sha256sum --check "$sums"
          done
          rm SHA256SUMS-*
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          path: release-tooling
          sparse-checkout: scripts/release
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}
          path: tagged
          sparse-checkout: CHANGELOG.md
          persist-credentials: false
      # The Tauri updater reads releases/latest/download/latest.json. It lists only
      # signed artifacts: the AppImage and the NSIS installer (REL-001).
      - name: Write the updater manifest and checksums
        run: |
          python3 release-tooling/scripts/release/updater_manifest.py "$RELEASE_TAG" dist "$GITHUB_REPOSITORY"
          cd dist
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS
      # The body comes from the tagged CHANGELOG.md, the files in dist and the pull requests
      # since the previous release (docs/core/releases.mdx, "Release page"). It fails when a
      # required file is missing, so an incomplete release is never published.
      - name: Write the release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp tagged/CHANGELOG.md release-tooling/CHANGELOG.md
          python3 release-tooling/scripts/release/notes.py "$RELEASE_TAG" dist "$GITHUB_REPOSITORY" release-notes.md
          echo "RELEASE_TITLE=WingDrive ${RELEASE_TAG#v}" >> "$GITHUB_ENV"
          cat release-notes.md >> "$GITHUB_STEP_SUMMARY"
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_TITLE }}
          body_path: release-notes.md
          prerelease: ${{ contains(env.RELEASE_TAG, '-') }}
          make_latest: ${{ !contains(env.RELEASE_TAG, '-') }}
          fail_on_unmatched_files: true
          files: dist/*

  # wingdrive-bin follows stable releases. wingdrive-nightly follows every release,
  # alpha, beta and rc included, so a stable tag updates both and nightly users are
  # never behind wingdrive-bin. A pre-release never reaches wingdrive-bin.
  # Posts the published notes to #changelog. It needs only publish, so an AUR
  # failure afterwards does not hold the post back, and verification or
  # AUR-only runs, which skip publish, post nothing.
  discord:
    name: Post release notes to Discord
    needs: publish
    if: needs.publish.result == 'success'
    permissions:
      contents: read
    uses: ./.github/workflows/discord.yml
    with:
      tag: ${{ github.event.inputs.tag || github.ref_name }}
    secrets: inherit

  aur:
    name: Publish ${{ matrix.package }} on AUR
    needs: publish
    if: always() && (needs.publish.result == 'success' || inputs.aur_only)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(contains(github.event.inputs.tag || github.ref_name, '-') && '["wingdrive-nightly"]' || '["wingdrive-bin","wingdrive-nightly"]') }}
    env:
      AUR_PACKAGE: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Download published assets and verify checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Only what the package needs; the release also carries large bundles for other platforms.
          gh release download "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --dir dist \
            --pattern 'WingDrive-*-x86_64.AppImage' --pattern LICENSE --pattern SHA256SUMS
          cd dist
          sha256sum --check --ignore-missing SHA256SUMS
      - name: Generate and validate AUR package in Arch Linux
        run: |
          python3 scripts/release/aur.py "${RELEASE_TAG#v}" "dist/WingDrive-${RELEASE_TAG#v}-x86_64.AppImage" dist/LICENSE packaging/aur "$AUR_PACKAGE"
          # Arch's newer system WebKit uses more memory than the bundled one.
          docker run --rm -e WINGDRIVE_NATIVE_MEMORY_BUDGET_MIB="${{ vars.WINGDRIVE_AUR_MEMORY_BUDGET_MIB || '850' }}" -v "$PWD:/work" archlinux:base bash -euc '
            pacman -Syu --noconfirm base-devel git
            useradd -m builder
            cp -r /work/packaging/aur /tmp/aur
            cp /work/dist/*.AppImage /work/dist/LICENSE /tmp/aur/
            chown -R builder:builder /tmp/aur
            cd /tmp/aur
            source PKGBUILD
            pacman -S --needed --noconfirm "${depends[@]}"
            pacman -S --needed --noconfirm xorg-server-xvfb xorg-xauth xdotool imagemagick python
            runuser -u builder -- makepkg --verifysource
            runuser -u builder -- makepkg --noconfirm
            pacman -U --noconfirm ./*.pkg.tar.zst
            runuser -u builder -- test -x /opt/wingdrive/usr/bin/WingDrive
            runuser -u builder -- test ! -e /opt/wingdrive/usr/lib/libwebkit2gtk-4.1.so.0
            runuser -u builder -- test -f /opt/wingdrive/usr/lib/wingdrive/libpdfium.so
            runuser -u builder -- env WINGDRIVE_NATIVE_MEMORY_BUDGET_MIB="$WINGDRIVE_NATIVE_MEMORY_BUDGET_MIB" WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS=1 WINGDRIVE_TEST_LAUNCHER=/usr/bin/wingdrive xvfb-run -a python /work/scripts/release/smoke.py /opt/wingdrive
            runuser -u builder -- makepkg --printsrcinfo > /work/packaging/aur/.SRCINFO
          '
      - name: Publish package metadata idempotently
        env:
          AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          AUR_KNOWN_HOSTS: ${{ secrets.AUR_KNOWN_HOSTS }}
        run: |
          test -n "$AUR_SSH_PRIVATE_KEY"
          test -n "$AUR_KNOWN_HOSTS"
          install -d -m700 ~/.ssh
          printf '%s\n' "$AUR_SSH_PRIVATE_KEY" > ~/.ssh/aur
          printf '%s\n' "$AUR_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/aur ~/.ssh/known_hosts
          export GIT_SSH_COMMAND='ssh -i ~/.ssh/aur -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes'
          trap 'rm -f ~/.ssh/aur' EXIT
          # Cloning a package that does not exist yet gives an empty repository, and
          # the first push creates the package under the key's AUR account.
          git clone "ssh://aur@aur.archlinux.org/$AUR_PACKAGE.git" /tmp/aur-repo
          cp packaging/aur/PKGBUILD packaging/aur/.SRCINFO /tmp/aur-repo/
          cd /tmp/aur-repo
          git add PKGBUILD .SRCINFO
          if ! git diff --cached --quiet; then
            git -c user.name=bernardopg -c user.email=bernardopg@users.noreply.github.com commit -m "Update WingDrive to $RELEASE_TAG"
            git push origin HEAD:master
          fi
