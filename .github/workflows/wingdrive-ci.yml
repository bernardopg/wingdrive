name: WingDrive CI

# The inherited upstream workflows target Blacksmith and self-hosted macOS and
# Windows runners that this fork has no access to, so they queue forever instead
# of failing. This workflow is the one that actually runs, on GitHub-hosted
# runners only, and covers the checks that are verified to pass on the fork.

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  CARGO_INCREMENTAL: 0
  CARGO_NET_RETRY: 10
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: short
  RUSTUP_MAX_RETRIES: 10
  SPACEDRIVE_CUSTOM_APT_FLAGS: --no-install-recommends

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tasks:
    name: Task Metadata
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: tasks-cargo-${{ hashFiles('**/Cargo.lock') }}

      # task-validator has no native dependencies, so it gates every pull
      # request in about a minute without waiting on the full system setup.
      - name: Validate task files
        run: cargo run -p task-validator -- validate

  typecheck:
    name: TypeScript
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: "1.3.14"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

  core:
    name: Core Build and Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Maximize build space
        uses: easimon/maximize-build-space@fc881a613ad2a34aca9c9624518214ebc21dfc0c # v10
        with:
          swap-size-mb: 3072
          root-reserve-mb: 6144
          remove-dotnet: "true"
          remove-codeql: "true"
          remove-haskell: "true"
          remove-docker-images: "true"

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup System and Rust
        uses: ./.github/actions/setup-system
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          target: x86_64-unknown-linux-gnu

      - name: Cache cargo build
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: linux-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: linux-cargo-build-

      - name: Check workspace
        run: cargo check --workspace

      # Guards FORK-001. A regression here silently orphans every install that
      # predates the fork, so it runs on every push rather than on demand.
      - name: Test branding and legacy path resolution
        run: |
          cargo test -p sd-core --lib branding::
          cargo test -p sd-core --test branding_legacy_paths
