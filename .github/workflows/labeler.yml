name: Labeler

# pull_request_target runs with the base branch's workflow and config, so pull
# requests from forks get labels too. It is safe here because nothing checks out
# or runs the pull request's code: the action only reads the changed paths.
on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    name: Label by changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # issues: write lets the action create a label from .github/labeler.yml that does not exist yet.
      issues: write
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          # Keep labels added by hand or by Dependabot when later pushes stop matching.
          sync-labels: false
