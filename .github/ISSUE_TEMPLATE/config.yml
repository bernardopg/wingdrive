# tell yaml plugin that this is the config file and not a template of its own:
# yaml-language-server: $schema=https://json.schemastore.org/github-issue-config.json
blank_issues_enabled: false
contact_links:
  - name: 🙏 Get help
    url: https://github.com/bernardopg/wingdrive/discussions/new?category=q-a
    about: If you can't get something to work the way you expect, ask in a Q&A discussion.
  - name: 💡 Feature request
    url: https://github.com/bernardopg/wingdrive/discussions/new?category=ideas
    about: Suggest a new feature in an Ideas discussion.
  - name: 🔒 Report a vulnerability
    url: https://github.com/bernardopg/wingdrive/security/advisories/new
    about: Report security issues privately, never in a public issue.
