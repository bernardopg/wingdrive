[package]
authors     = ["Spacedrive Technology Inc."]
description = "SDK for building WingDrive WASM extensions"
edition     = "2021"
license     = "MIT OR Apache-2.0"
name        = "wingdrive-sdk"
repository  = "https://github.com/bernardopg/wingdrive"
version     = "0.1.0"

[dependencies]
chrono                = { version = "0.4", default-features = false, features = ["serde"] }
serde                 = { version = "1.0", default-features = false, features = ["alloc", "derive"] }
serde_json            = { version = "1.0", default-features = false, features = ["alloc"] }
wingdrive-sdk-macros = { path = "../sdk-macros" }
thiserror             = { version = "2.0", default-features = false }
uuid                  = { version = "1.0", default-features = false, features = ["serde", "v4"] }

# Extensions build for wasm32-unknown-unknown, where uuid's v4 needs a named source of randomness.
[target.'cfg(target_arch = "wasm32")'.dependencies]
uuid = { version = "1.0", default-features = false, features = ["js"] }

[dev-dependencies]
tokio = { version = "1.0", features = ["macros", "rt"] }
