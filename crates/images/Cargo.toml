[package]
name    = "sd-images"
version = "0.1.0"

authors              = ["Jake Robinson <jake@spacedrive.com>", "Vítor Vasconcellos <vitor@spacedrive.com>"]
edition.workspace    = true
license.workspace    = true
repository.workspace = true

[features]
heif = ["dep:libheif-rs", "dep:libheif-sys"]

[dependencies]
# Workspace dependencies
image     = { workspace = true }
serde     = { workspace = true, optional = true, features = ["derive"] }
specta    = { workspace = true, optional = true }
thiserror = { workspace = true }
tracing   = { workspace = true }

# Specific Images dependencies
# bincode optional dep removed: unmaintained (RUSTSEC-2025-0141) and its
# Encode/Decode derive was never enabled by any crate in the workspace.
# libheif defaults stay off to avoid bindgen and use pre-compiled headers.
libheif-rs  = { version = "1.0", default-features = false, optional = true }
libheif-sys = { version = "2.1", default-features = false, optional = true }
resvg       = "0.48"

[dependencies.pdfium-render]
default-features = false
features         = ["image_025", "pdfium_6666", "thread_safe"]
version          = "0.9.3"
