[workspace]
exclude = ["crates/json-sample-derive", "extensions/*"]
members = [
	# "apps/cloud",
	# "apps/desktop/crates/*",
	# "apps/desktop/src-tauri",
	# "apps/mobile/modules/wing-core/android/crate",
	# "apps/mobile/modules/wing-core/core",
	# "apps/mobile/modules/wing-core/ios/crate",
	"apps/mobile/modules/wing-mobile-core/core",
	"apps/server",
	"apps/cli",
	# "apps/gpui-photo-grid",
	"apps/tauri/wing-tauri-core",
	"apps/tauri/src-tauri",
	"core",
	"core/benchmarks",
	"crates/*",
	"xtask"
]
# Exclude Tauri from default builds - it requires frontend to be built first
# Use `cd apps/tauri && bun run tauri:dev` to run the Tauri app
default-members = [
	"apps/server",
	"apps/cli",
	"core",
	"core/benchmarks",
	"crates/*",
	"xtask"
]
resolver = "2"

[workspace.package]
edition      = "2021"
license      = "Apache-2.0"
homepage     = "https://wingdrive.org"
repository   = "https://github.com/bernardopg/wingdrive"
rust-version = "1.89"

[workspace.dependencies]
# First party dependencies

# Third party dependencies used by one or more of our crates
anyhow              = "1.0.104"
async-channel       = "2.5"
async-trait         = "0.1.92"
axum                = "0.8.9"
base64              = "0.23.1"
blake3              = "1.8.6"
chrono              = "0.4.45"
futures             = "0.3.34"
futures-concurrency = "7.7.1"
image               = "0.25.10"
libc                = "0.2.189"
pin-project-lite    = "0.2.17"
rand                = "0.10.2"
rmp-serde           = "1.3.1"
serde               = "1.0.229"
serde_json          = "1.0.151"
specta              = "=2.0.0-rc.27"
tempfile            = "3.27.0"
thiserror           = "2.0.20"
tokio               = "1.53.1"
tokio-stream        = "0.1.19"
tokio-util          = "0.7.19"
tracing             = "0.1.44"
tracing-subscriber  = "0.3.23"
tracing-test        = "0.2.6"
uuid                = "1.24"                                           # Must follow version used by specta
webp                = "0.3.1"
zeroize             = "1.9"
sqlx                = { version = "0.9", default-features = false, features = ["sqlite", "runtime-tokio"] }
indexmap            = "2.14"
toml                = "1.1"

# Patches removed - project migrated from libp2p to iroh

[profile.dev]
# Make compilation faster on macOS
codegen-units   = 256
debug           = 0
incremental     = true
lto             = false
opt-level       = 0
split-debuginfo = "unpacked"
strip           = "none"

[profile.dev-debug]
inherits = "dev"
# Enables debugger
codegen-units = 256
debug         = "full"
incremental   = true
lto           = "off"
opt-level     = 0
# split-debuginfo = "none"
strip = "none"

# Set the settings for build scripts and proc-macros.
[profile.dev.build-override]
opt-level = 3

# Set the default for dependencies, except workspace members.
[profile.dev.package."*"]
incremental = false
opt-level   = 3

# Set the default for dependencies, except workspace members.
[profile.dev-debug.package."*"]
debug       = "full"
incremental = false
inherits    = "dev"
opt-level   = 3

# Optimize release builds
[profile.release]
codegen-units = 1        # Compile crates one after another so the compiler can optimize better
lto           = true     # Enables link to optimizations
opt-level     = "s"      # Optimize for binary size
panic         = "unwind" # Sadly we need unwind to avoid unexpected crashes on third party crates
strip         = true     # Remove debug symbols

# Fast mobile development profile - trades binary size for build speed
# Use with: cargo build --profile mobile-dev
# For production mobile releases, use --release instead
[profile.mobile-dev]
inherits      = "release"
codegen-units = 16       # Allow parallel compilation (vs 1 in release)
lto           = false    # Disable link-time optimization (saves 15-20 min per arch)
opt-level     = 2        # Good optimization without extreme size focus
strip         = true     # Still remove debug symbols

[patch.crates-io]
# GHSA-wrw7-89jp-8q8g backport for the GTK3 stack used by Tauri on Linux.
# See patches/README.md.
glib = { path = "patches/glib-0.18.5" }
# E0365 future-incompat fix for the copy wasmer-derive pulls in. See patches/README.md.
proc-macro-error2 = { path = "patches/proc-macro-error2-2.0.1" }
